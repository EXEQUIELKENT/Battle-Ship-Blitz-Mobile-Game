name: Release

on:
  push:
    tags:
      - 'v*.*.*'          # e.g. v1.0.0, v1.2.3
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.1)'
        required: true

permissions:
  contents: write          # needed so the action can create the Release/tag

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve release tag
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Decode the real signing key from GitHub Secrets.
      #
      # ROOT-CAUSE FIX (releases kept needing an uninstall to update):
      # this step used to be gated with
      #   if: ${{ env.HAS_KEYSTORE == 'true' }}
      #   env: { HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }} }
      # — but a step's `if:` cannot see an `env:` block defined on that
      # SAME step (GitHub only exposes step-level env once the step is
      # already running, not while its own `if:` is evaluated). So
      # `env.HAS_KEYSTORE` was always empty, the condition was always
      # false, and this step silently never ran — even with the secrets
      # set correctly. Every release therefore fell back to a fresh
      # debug key generated by that run's throwaway GitHub runner, which
      # is exactly why each new release conflicted with the last one.
      #
      # Fixed the same way build-apk.yml already does it: the step always
      # runs, and the *script* decides what to do based on whether the
      # secret is actually set — no if: needed at all.
      - name: Set up Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — this build"
            echo "::warning::will be signed with a throwaway debug key and"
            echo "::warning::will NOT install over any previous release."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
          {
            echo "storePassword=$ANDROID_STORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=${ANDROID_KEY_ALIAS:-battleshipblitz}"
          } > android/app/key.properties

      - name: Build release APK
        env:
          BBZ_SERVER: ${{ vars.BBZ_SERVER }}
        run: |
          flutter build apk --release \
            --dart-define=BBZ_SERVER="${BBZ_SERVER:-https://envious-dropbox-taste.ngrok-free.dev/Battle-Ship-Blitz-Mobile-Game/server}"

      - name: Build release App Bundle
        env:
          BBZ_SERVER: ${{ vars.BBZ_SERVER }}
        run: |
          flutter build appbundle --release \
            --dart-define=BBZ_SERVER="${BBZ_SERVER:-https://envious-dropbox-taste.ngrok-free.dev/Battle-Ship-Blitz-Mobile-Game/server}"

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/battleship-blitz-${{ steps.ver.outputs.tag }}.apk"
          cp build/app/outputs/bundle/release/app-release.aab \
             "dist/battleship-blitz-${{ steps.ver.outputs.tag }}.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Battleship Blitz ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: dist/*
